<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BETAPP">
<title>BETAPP</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#fff;--text-dim:#8b949e;--accent:#ffcc00;--green:#238636;--red:#da3633;--blue:#58a6ff;--border:#30363d;--card-border:#21262d}
body.light{--bg:#f5f5f7;--bg2:#fff;--bg3:#e8e8ed;--text:#1d1d1f;--text-dim:#6e6e73;--accent:#ff9500;--green:#34c759;--red:#ff3b30;--blue:#0071e3;--border:#d2d2d7;--card-border:#e8e8ed}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
#authScreen{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.logo{font-size:44px;font-weight:900;margin-bottom:6px;letter-spacing:-1px}
.logo span{color:var(--accent)}
.subtitle{color:var(--text-dim);margin-bottom:32px;font-size:14px}
.auth-box{width:100%;max-width:380px;background:var(--bg2);padding:24px;border-radius:16px;border:1px solid var(--border)}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;background:var(--bg3);border:none;border-radius:10px;color:var(--text-dim);font-weight:600;font-size:14px;cursor:pointer}
.auth-tab.active{background:var(--accent);color:#000}
.auth-box input{width:100%;padding:14px;margin-bottom:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;outline:none}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.msg{padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;text-align:center;display:none}
.msg.show{display:block}
.msg.err{background:var(--red);color:#fff}
.msg.ok{background:var(--green);color:#fff}
#appScreen{display:none;padding-bottom:100px}
.header{position:sticky;top:0;z-index:10;background:var(--bg2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.header .logo{font-size:22px;margin:0}
.right-head{display:flex;gap:8px;align-items:center}
.theme-btn{background:var(--bg3);border:none;color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;justify-content:center;align-items:center}
.balance{background:linear-gradient(135deg,var(--green),#2ea043);padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;color:#fff}
.freebet-badge{background:linear-gradient(135deg,var(--accent),#ff9500);color:#000;padding:8px 12px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;display:none}
.freebet-badge.show{display:block}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:57px;z-index:9}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;background:var(--bg3);border:none;border-radius:20px;color:var(--text-dim);font-weight:600;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.active{background:var(--accent);color:#000}
.match{background:var(--bg2);margin:8px 12px;border-radius:12px;padding:14px;border:1px solid var(--card-border);cursor:pointer;position:relative}
.match.goal-flash{animation:gf 2s}
@keyframes gf{0%,100%{background:var(--bg2)}30%{background:#238636}}
.match.mybet{border:2px solid var(--accent)}
.match.mybet::after{content:'🎯 ТВОЯ СТАВКА';position:absolute;top:-8px;right:12px;background:var(--accent);color:#000;font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px}
.match-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;align-items:center}
.league{color:var(--text-dim)}
.time{color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px}
.live-dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;animation:p 1s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.teams{font-size:16px;font-weight:600;margin-bottom:12px;line-height:1.3}
.score{color:var(--accent);font-weight:900;margin-left:6px;font-size:18px}
.lock-banner{background:var(--red);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;margin-bottom:8px}
.lock-banner.restart{background:var(--accent);color:#000}
.lock-banner.break{background:var(--blue);color:#fff}
.odds-row{display:flex;gap:8px}
.odd{flex:1;background:var(--bg3);padding:10px 6px;border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent}
.odd.selected{background:var(--accent);border-color:var(--accent)}
.odd.selected .odd-label,.odd.selected .odd-value{color:#000}
.odd.locked{opacity:.4}
.odd-label{color:var(--text-dim);font-size:11px;margin-bottom:2px}
.odd-value{font-size:16px;font-weight:700;color:var(--text)}
.match-hint{font-size:10px;color:var(--text-dim);text-align:center;margin-top:6px;font-style:italic}
.badge{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#000;width:60px;height:60px;border-radius:50%;display:none;justify-content:center;align-items:center;font-weight:900;font-size:22px;cursor:pointer;z-index:50;box-shadow:0 6px 24px rgba(255,204,0,.4)}
.badge.show{display:flex}
.slip{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--accent);padding:16px;transform:translateY(100%);transition:transform .3s;max-height:75vh;overflow-y:auto;z-index:100;border-radius:16px 16px 0 0}
.slip.open{transform:translateY(0)}
.slip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.slip-title{font-weight:700;font-size:18px}
.close-btn{background:var(--bg3);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer}
.slip-item{background:var(--bg);padding:12px;border-radius:10px;margin-bottom:8px;font-size:14px;position:relative}
.slip-item .remove{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);font-size:20px;cursor:pointer}
.slip-item .m{color:var(--text-dim);font-size:12px;margin-top:4px}
.slip-item .o{color:var(--accent);font-weight:700}
.slip-express{background:var(--bg3);padding:8px;border-radius:8px;font-size:12px;color:var(--accent);text-align:center;margin-bottom:8px}
.input-row{display:flex;gap:8px;margin:12px 0}
.input-row input{flex:1;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;outline:none}
.quick-btn{padding:12px 14px;background:var(--bg3);border:none;border-radius:10px;color:var(--text);font-weight:600;cursor:pointer;font-size:13px}
.use-freebet{background:var(--accent);color:#000;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-bottom:8px;display:none}
.use-freebet.show{display:block}
.payout{background:var(--bg);padding:14px;border-radius:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.payout strong{color:var(--accent);font-size:20px}
.profile{padding:16px}
.card{background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--card-border)}
.card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card-border);font-size:14px}
.row:last-child{border:none}
.row span:first-child{color:var(--text-dim)}
.history-item{background:var(--bg);padding:10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.history-item .status{font-weight:700;margin-left:6px}
.status.pending{color:var(--accent)}
.status.win{color:var(--green)}
.status.lose{color:var(--red)}
.status.return{color:var(--blue)}
.status.cashout{color:#ff9500}
.cashout-btn{background:linear-gradient(135deg,#ff9500,#ffcc00);color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;margin-top:6px;width:100%}
.deposit-btn-big{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),#2ea043);border:none;color:#fff;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--green);color:#fff;padding:14px 24px;border-radius:12px;font-weight:600;z-index:1000;transition:transform .3s;max-width:90%;text-align:center;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:40}
.nav-item{flex:1;background:none;border:none;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
.nav-item.active{color:var(--accent)}
.nav-item .icon{font-size:20px}
.spread-modal{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;flex-direction:column;overflow:hidden}
.spread-modal.show{display:flex}
.spread-head{background:var(--bg2);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.spread-head-left{flex:1;min-width:0}
.spread-back{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:0 12px 0 0;flex-shrink:0}
.spread-league{font-size:11px;color:var(--text-dim);margin-bottom:2px}
.spread-teams-line{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.spread-teams-line .sc{color:var(--accent);font-weight:900;font-size:20px}
.spread-meta{font-size:11px;color:var(--text-dim);margin-top:2px}
.spread-icon-btn{background:var(--bg3);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;justify-content:center;align-items:center}
.spread-icon-btn.active{background:var(--accent);color:#000}
.spread-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.spread-tabs::-webkit-scrollbar{display:none}
.spread-tab{padding:12px 16px;background:none;border:none;color:var(--text-dim);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.spread-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.spread-body{flex:1;overflow-y:auto;padding-bottom:100px;background:var(--bg)}
.market-section{background:var(--bg2);margin:8px 12px;border-radius:12px;padding:14px;border:1px solid var(--card-border)}
.market-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.market-row{display:flex;gap:6px;margin-bottom:6px}
.market-row:last-child{margin-bottom:0}
.market-btn{flex:1;background:var(--bg3);border:2px solid transparent;border-radius:8px;padding:10px 4px;cursor:pointer;text-align:center;min-width:0}
.market-btn.selected{background:var(--accent);border-color:var(--accent)}
.market-btn.selected .mbl,.market-btn.selected .mbv{color:#000}
.market-btn.locked{opacity:.4}
.market-btn .mbl{display:block;color:var(--text-dim);font-size:10px;margin-bottom:2px;font-weight:600}
.market-btn .mbv{display:block;color:var(--text);font-size:14px;font-weight:700}
.total-selector{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.total-selector::-webkit-scrollbar{display:none}
.total-num{padding:8px 14px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.total-num.active{background:var(--accent);border-color:var(--accent);color:#000}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.score-cell{background:var(--bg3);border:2px solid transparent;border-radius:8px;padding:10px 6px;cursor:pointer;text-align:center}
.score-cell.selected{background:var(--accent);border-color:var(--accent)}
.score-cell.selected .scv{color:#000}
.score-cell .scl{font-size:10px;color:var(--text-dim);margin-bottom:2px}
.score-cell .scv{font-size:14px;font-weight:700;color:var(--text)}
.stats-body{padding:16px}
.stat-item{margin-bottom:16px}
.stat-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;font-weight:600}
.stat-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;display:flex}
.stat-bar-home{background:var(--accent);height:100%}
.stat-bar-away{background:var(--green);height:100%}
.stat-val-home{color:var(--accent)}
.stat-val-away{color:var(--green)}
.no-data{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:14px}
.sync-info{background:var(--bg);padding:8px 12px;border-radius:8px;font-size:11px;color:var(--text-dim);text-align:center;margin:8px 12px}
</style>
</head>
<body>
<div id="authScreen">
  <div class="logo">BET<span>APP</span></div>
  <div class="subtitle">Ставки на спорт • Live</div>
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Вход</button>
      <button class="auth-tab" id="tabReg" onclick="switchAuth('reg')">Регистрация</button>
    </div>
    <div id="msg" class="msg"></div>
    <input id="loginInput" placeholder="Логин">
    <input id="passInput" type="password" placeholder="Пароль">
    <input id="pass2Input" type="password" placeholder="Повтор пароля" style="display:none">
    <button class="btn-primary" id="submitBtn" onclick="submitAuth()">Войти</button>
  </div>
</div>
<div id="appScreen">
  <div class="header">
    <div class="logo">BET<span>APP</span></div>
    <div class="right-head">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <div class="freebet-badge" id="freebetBadge" onclick="showPage('roulette')">🎁 <span id="freebetAmount">0</span></div>
      <div class="balance" id="balance" onclick="showDeposit()">💰 10 000 ₽</div>
    </div>
  </div>
  <div id="pageBets">
    <div class="tabs" id="tabs"></div>
    <div class="sync-info" id="syncInfo">🕒 Синхронизация</div>
    <div id="matches"></div>
  </div>
  <div id="pageRoulette" style="display:none">
    <div style="padding:20px 16px;text-align:center">
      <div style="font-size:24px;font-weight:900;margin-bottom:8px">🎰 Колесо Фортуны</div>
      <div style="color:var(--text-dim);font-size:14px;margin-bottom:24px">Крути раз в неделю</div>
      <div style="position:relative;width:280px;height:280px;margin:0 auto 24px">
        <div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--accent);z-index:10"></div>
        <div id="wheel" style="width:100%;height:100%;border-radius:50%;transition:transform 5s cubic-bezier(.17,.67,.15,1);background:conic-gradient(#ffcc00 0deg 60deg,#238636 60deg 120deg,#f85149 120deg 180deg,#58a6ff 180deg 240deg,#a371f7 240deg 300deg,#ff9500 300deg 360deg);border:6px solid var(--bg2)"></div>
      </div>
      <button class="btn-primary" id="spinBtn" onclick="spinWheel()" style="max-width:240px;margin-bottom:12px">КРУТИТЬ 🎰</button>
      <div id="cooldown" style="color:var(--text-dim);font-size:14px"></div>
    </div>
  </div>
  <div id="pageProfile" style="display:none">
    <div class="profile">
      <div class="card">
        <h3>👤 Профиль</h3>
        <div class="row"><span>Логин</span><span id="pName">—</span></div>
        <div class="row"><span>Баланс</span><span id="pBalance">—</span></div>
        <div class="row"><span>Фрибеты</span><span id="pFreebet">0 ₽</span></div>
        <div class="row"><span>Всего ставок</span><span id="pBets">0</span></div>
        <div class="row"><span>Выигрышей</span><span id="pWins">0</span></div>
        <div class="row"><span>В игре</span><span id="pInPlay">0 ₽</span></div>
        <div class="row"><span>Лимит пополнения</span><span id="pLimit">—</span></div>
        <button class="deposit-btn-big" onclick="showDeposit()">💳 Пополнить баланс</button>
      </div>
      <div class="card">
        <h3>📜 История ставок</h3>
        <div id="history"></div>
      </div>
      <button class="btn-primary" style="background:var(--red);color:#fff" onclick="logout()">Выйти</button>
    </div>
  </div>
</div>
<div class="badge" id="badge" onclick="toggleSlip()"><span id="badgeCount">0</span></div>
<div class="slip" id="slip">
  <div class="slip-head"><div class="slip-title">🎫 Купон</div><button class="close-btn" onclick="toggleSlip()">✕</button></div>
  <div id="slipItems"></div>
  <div id="slipExpress"></div>
  <button class="use-freebet" id="useFreebetBtn" onclick="toggleFreebet()">🎁 Использовать фрибет</button>
  <div class="input-row">
    <input id="stakeInput" type="number" value="100" min="10">
    <button class="quick-btn" onclick="setStake(100)">100</button>
    <button class="quick-btn" onclick="setStake(500)">500</button>
    <button class="quick-btn" onclick="setStake(1000)">1000</button>
  </div>
  <div class="payout"><span>Выигрыш:</span><strong id="payout">0 ₽</strong></div>
  <button class="btn-primary" onclick="placeBet()">Сделать ставку</button>
</div>
<div class="bottom-nav" id="bottomNav" style="display:none">
  <button class="nav-item active" onclick="showPage('bets')" id="navBets"><span class="icon">⚽</span>Линия</button>
  <button class="nav-item" onclick="showPage('roulette')" id="navRoulette"><span class="icon">🎰</span>Рулетка</button>
  <button class="nav-item" onclick="showPage('profile')" id="navProfile"><span class="icon">👤</span>Профиль</button>
</div>
<div id="resultModal" style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:2000;padding:20px">
  <div style="background:var(--bg2);border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;border:2px solid var(--accent)">
    <div style="font-size:64px;margin-bottom:8px" id="resultEmoji">🎉</div>
    <h2 style="font-size:26px;margin-bottom:12px" id="resultTitle">Поздравляем!</h2>
    <div style="font-size:48px;font-weight:900;color:var(--accent);margin:16px 0" id="resultAmount">0 ₽</div>
    <p style="color:var(--text-dim);font-size:14px;margin-bottom:20px" id="resultText">Фрибет зачислен</p>
    <button class="btn-primary" onclick="closeResult()">Забрать 🎁</button>
  </div>
</div>
<div class="spread-modal" id="spreadModal">
  <div class="spread-head">
    <button class="spread-back" onclick="closeSpread()">←</button>
    <div class="spread-head-left" id="spreadHeadInfo"></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="spread-icon-btn" id="statsBtn" onclick="toggleStats()">📊</button>
    </div>
  </div>
  <div class="spread-tabs" id="spreadTabs"></div>
  <div class="spread-body" id="spreadBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let DB={},currentUser=null,balance=0,freebet=0,bets=[],betHistory=[];
let selectedSport='⚽ Футбол',authMode='login',useFreebet=false;
let shownGoalKeys={},currentSpreadMatch=null,currentSpreadTab='match',currentSpreadStat=false;
let totalLine=2.5,half1TotalLine=0.5,half2TotalLine=0.5;
let myBetMatchIds={};

const DAILY_LIMIT=1500000,WEEK_MS=7*24*60*60*1000;
const PRIZES=[500,1000,2500,5000,10000,15000];
const EPOCH_OFFSET=1735689600;
const SPORTS=['⚽ Футбол'];

function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  localStorage.setItem('betapp_theme',isLight?'light':'dark');
  document.getElementById('themeBtn').textContent=isLight?'☀️':'🌙';
}
(function(){if((localStorage.getItem('betapp_theme')||'dark')==='light'){document.body.classList.add('light');setTimeout(()=>{const b=document.getElementById('themeBtn');if(b)b.textContent='☀️';},100);}})();

try{DB=JSON.parse(localStorage.getItem('betapp_users')||'{}');currentUser=localStorage.getItem('betapp_current');}catch(e){DB={};}
function saveDB(){try{localStorage.setItem('betapp_users',JSON.stringify(DB));}catch(e){}}
function saveCurrent(){try{if(currentUser)localStorage.setItem('betapp_current',currentUser);else localStorage.removeItem('betapp_current');}catch(e){}}

// ============ КЭФЫ ИЗ РЕЙТИНГА ============
// ПСЖ (10) vs Аякс (7) → П1 ~1.55, X ~4.20, П2 ~5.80
// Реал (10) vs Хетафе (4) → П1 ~1.15, X ~5.50, П2 ~15.0
function ratingToOdds(rHome,rAway){
  // Домашнее преимущество +1
  const diff = (rHome + 1.0) - rAway;
  
  // Вероятность победы хозяев — логистическая
  let pHome = 1 / (1 + Math.exp(-diff * 0.45));
  
  // Ничья — база 26%
  let pDraw = 0.26 + Math.max(0, (1 - Math.abs(diff)/8) * 0.08);
  pDraw = Math.max(0.19, Math.min(0.34, pDraw));
  
  // Победа гостей — остаток
  let pAway = 1 - pHome - pDraw;
  
  // Корректировка
  if(pAway < 0.03){ pAway = 0.03; pHome = 1 - pDraw - pAway; }
  if(pHome < 0.03){ pHome = 0.03; pAway = 1 - pDraw - pHome; }
  
  // Кэфы с маржой 5%
  const margin = 1.05;
  let o1 = 1 / (pHome * margin);
  let oX = 1 / (pDraw * margin);
  let o2 = 1 / (pAway * margin);
  
  // Границы
  o1 = Math.max(1.05, Math.min(20, o1));
  oX = Math.max(3.20, Math.min(5.80, oX));
  o2 = Math.max(1.05, Math.min(25, o2));
  
  return [Math.round(o1*100)/100, Math.round(oX*100)/100, Math.round(o2*100)/100];
}

function generateMatches(epoch){
  const matches=[];
  let id=100;
  let timeOffset=0;
  Object.keys(LEAGUES).forEach(league=>{
    const teams=LEAGUES[league];
    const r=(o)=>seededRandom(epoch*97+league.length*13+o);
    let count=1;
    if(league==='🏴 АПЛ'||league==='🇪🇸 Ла Лига'||league==='🇮🇹 Серия А'||league==='🏆 Лига Чемпионов')count=2;
    for(let i=0;i<count;i++){
      let t1Idx=Math.floor(r(10+i*7)*teams.length);
      let t2Idx=Math.floor(r(11+i*7)*teams.length);
      if(t2Idx===t1Idx)t2Idx=(t1Idx+1)%teams.length;
      const t1=teams[t1Idx],t2=teams[t2Idx];
      const odds=ratingToOdds(t1[1],t2[1]);
      timeOffset+=25+Math.floor(r(50+i)*25);
      matches.push({id:id++,league,home:t1[0],away:t2[0],homeRating:t1[1],awayRating:t2[1],baseOdds:odds,startOffset:timeOffset});
    }
  });
  return matches;
}

let MATCHES_CACHE=[];
let MATCHES_EPOCH=-1;
function refreshMatches(){
  const epoch=Math.floor(Date.now()/300000);
  if(epoch===MATCHES_EPOCH)return;
  MATCHES_EPOCH=epoch;
  MATCHES_CACHE=generateMatches(epoch);
}
function findMatchById(id){refreshMatches();return MATCHES_CACHE.find(m=>m.id===id);}

const MATCH_DURATION=300,BREAK_DURATION=30,AFTER_DURATION=60;
const CYCLE=MATCH_DURATION+BREAK_DURATION+AFTER_DURATION;
const FIRST_HALF_SEC=145,SECOND_HALF_SEC=145;

function generateScenario(match,cycleIdx){
  const seed=match.id*7777777+cycleIdx*13;
  const r=(o)=>seededRandom(seed+o);
  const rGoals=r(1);
  let totalGoals;
  if(rGoals<0.25)totalGoals=0;
  else if(rGoals<0.55)totalGoals=1;
  else if(rGoals<0.78)totalGoals=2;
  else if(rGoals<0.92)totalGoals=3;
  else if(rGoals<0.98)totalGoals=4;
  else totalGoals=5;
  const homeStrength=match.homeRating+0.5;
  const awayStrength=match.awayRating;
  const homeProb=homeStrength/(homeStrength+awayStrength);
  const injury1=1+Math.floor(r(2)*4);
  const injury2=2+Math.floor(r(3)*5);
  const goals=[];
  for(let i=0;i<totalGoals;i++){
    const minute=1+Math.floor(r(100+i)*90);
    const homeAway=r(200+i)<homeProb?0:1;
    goals.push([homeAway,minute]);
  }
  goals.sort((a,b)=>a[1]-b[1]);
  const redHome=r(300)>0.92?(40+Math.floor(r(301)*40)):0;
  const redAway=r(310)>0.92?(40+Math.floor(r(311)*40)):0;
  const yellowHome=1+Math.floor(r(320)*4);
  const yellowAway=1+Math.floor(r(330)*4);
  return{goals,injury1,injury2,totalGoals,redHome,redAway,yellowHome,yellowAway};
}

function getMatchState(match){
  const nowSec=Math.floor(Date.now()/1000)-EPOCH_OFFSET;
  const epochShift=Math.floor(Date.now()/300000);
  const cycleTotalSec=epochShift*1800+match.startOffset;
  const rawPos=(nowSec-cycleTotalSec)%CYCLE;
  const pos=rawPos<0?rawPos+CYCLE:rawPos;
  const cycleIndex=Math.floor((nowSec-cycleTotalSec)/CYCLE);
  const scenario=generateScenario(match,cycleIndex);
  if(pos<FIRST_HALF_SEC){
    const progress=pos/FIRST_HALF_SEC;
    const gameMinute=Math.floor(progress*(45+scenario.injury1));
    let h=0,a=0;
    scenario.goals.forEach(g=>{if(g[1]<=gameMinute&&g[1]<=45+scenario.injury1){if(g[0]===0)h++;else a++;}});
    let timeStr=gameMinute+"'";
    if(gameMinute>45)timeStr="45+"+(gameMinute-45)+"'";
    return{phase:'first',live:true,minute:gameMinute,timeStr,score:[h,a],scenario,cycleIndex};
  }
  if(pos<FIRST_HALF_SEC+BREAK_DURATION){
    const breakLeft=FIRST_HALF_SEC+BREAK_DURATION-pos;
    let h=0,a=0;
    scenario.goals.forEach(g=>{if(g[1]<=45+scenario.injury1){if(g[0]===0)h++;else a++;}});
    return{phase:'break',live:false,isBreak:true,breakLeft,minute:45,timeStr:'Перерыв',score:[h,a],scenario,cycleIndex};
  }
  if(pos<FIRST_HALF_SEC+BREAK_DURATION+SECOND_HALF_SEC){
    const posIn2=pos-FIRST_HALF_SEC-BREAK_DURATION;
    const progress=posIn2/SECOND_HALF_SEC;
    const totalSecond=45+scenario.injury2;
    const gameMinute=45+Math.floor(progress*totalSecond);
    let h=0,a=0;
    scenario.goals.forEach(g=>{if(g[1]<=gameMinute){if(g[0]===0)h++;else a++;}});
    let timeStr=gameMinute+"'";
    if(gameMinute>90)timeStr="90+"+(gameMinute-90)+"'";
    return{phase:'second',live:true,minute:gameMinute,timeStr,score:[h,a],scenario,cycleIndex};
  }
  const afterPos=pos-FIRST_HALF_SEC-BREAK_DURATION-SECOND_HALF_SEC;
  const afterLeft=AFTER_DURATION-afterPos;
  let h=0,a=0;
  scenario.goals.forEach(g=>{if(g[0]===0)h++;else a++;});
  return{phase:'after',live:false,isFinished:true,afterLeft,minute:90+scenario.injury2,timeStr:'Завершён',score:[h,a],scenario,cycleIndex};
}

function getMatchOdds(match,state){
  const base=match.baseOdds;
  if(!state.live)return base.map(o=>o);
  const min=state.minute;
  const[h,a]=state.score;
  const diff=h-a;
  const timeLeft=Math.max(1,90-min);
  const progress=Math.min(min/90,1);
  const expectedGoals=timeLeft*(2.7/90);
  
  function probAtLeast(n,lambda){
    if(n<=0)return 1;
    let cumul=0,p=Math.exp(-lambda);
    cumul+=p;
    for(let k=1;k<n;k++){p=p*lambda/k;cumul+=p;}
    return 1-cumul;
  }
  
  const results=[0,0,0];
  
  if(diff===0){
    const totalProb = probAtLeast(1,expectedGoals);
    const homeStrength = match.homeRating + 1;
    const awayStrength = match.awayRating;
    const pHomeNext = totalProb * (homeStrength / (homeStrength + awayStrength));
    const pAwayNext = totalProb * (awayStrength / (homeStrength + awayStrength));
    results[0] = pHomeNext;
    results[1] = Math.max(0.10, 1 - pHomeNext - pAwayNext);
    results[2] = pAwayNext;
  } else if(diff>0){
    const pAwayEqual = probAtLeast(diff, expectedGoals);
    const pAwayWin = probAtLeast(diff+1, expectedGoals);
    results[0] = 1 - pAwayEqual;
    results[1] = Math.max(0.02, pAwayEqual - pAwayWin);
    results[2] = pAwayWin;
  } else {
    const pHomeEqual = probAtLeast(-diff, expectedGoals);
    const pHomeWin = probAtLeast(-diff+1, expectedGoals);
    results[0] = pHomeWin;
    results[1] = Math.max(0.02, pHomeEqual - pHomeWin);
    results[2] = 1 - pHomeEqual;
  }
  
  const bp0=1/base[0],bp1=1/base[1],bp2=1/base[2];
  const bsum=bp0+bp1+bp2;
  const mix=Math.min(1,progress*1.2+0.3);
  let p0=results[0]*(1-mix*0.3)+(bp0/bsum)*(mix*0.3);
  let p1=results[1]*(1-mix*0.5)+(bp1/bsum)*(mix*0.5);
  let p2=results[2]*(1-mix*0.3)+(bp2/bsum)*(mix*0.3);
  
  const sum=p0+p1+p2;
  p0/=sum;p1/=sum;p2/=sum;
  const probs=[p0,p1,p2];
  probs.forEach((p,i)=>{probs[i]=Math.max(0.02,Math.min(0.95,p));});
  
  return base.map((o,i)=>{
    if(o===0)return 0;
    let odd=Math.round((1/probs[i])*100)/100;
    if(i===1){
      if(odd<1.05)odd=1.05;
      if(odd>25)odd=25;
      if(diff===0&&progress>0.85&&progress<0.95)odd=Math.max(1.10,Math.min(1.40,odd));
      if(diff===0&&progress>=0.95)odd=Math.max(1.05,Math.min(1.15,odd));
    }
    if(i!==1&&odd>30)odd=30;
    if(odd<1.01)odd=1.01;
    return odd;
  });
}

function getTotalOdds(state,line){
  const[h,a]=state.score;
  const totalGoals=h+a;
  const min=state.minute;
  const timeLeft=Math.max(1,90-min);
  if(state.phase==='after'){
    if(totalGoals>line)return[1.01,99.00];
    if(totalGoals===line)return[1.01,1.01];
    return[99.00,1.01];
  }
  if(totalGoals>line)return[1.01,99.00];
  if(totalGoals===line)return[1.01,1.01];
  const needed=Math.floor(line)-totalGoals+1;
  const expectedGoals=timeLeft*(2.7/90);
  let cumul=Math.exp(-expectedGoals),p=cumul;
  for(let k=1;k<needed;k++){p=p*expectedGoals/k;cumul+=p;}
  let pOver=1-cumul;
  pOver=Math.max(0.15,Math.min(0.85,pOver));
  let over=Math.round((1/pOver)*100)/100;
  let under=Math.round((1/(1-pOver))*100)/100;
  if(over<1.15)over=1.15;
  if(under<1.10)under=1.10;
  if(over>8)over=8;
  if(under>8)under=8;
  return[over,under];
}

function getHalfTotalOdds(state,half,line){
  if(half===1){
    if(state.phase!=='first')return null;
    const[h,a]=state.score;
    const g1=h+a;
    const min=state.minute;
    if(g1>line)return[1.01,99.00];
    if(g1===line)return[1.01,1.01];
    if(min>=46)return[99.00,1.01];
    const timeLeft=Math.max(1,45-min);
    const needed=Math.floor(line)-g1+1;
    const expectedGoals=timeLeft*(1.25/45);
    let cumul=Math.exp(-expectedGoals),p=cumul;
    for(let k=1;k<needed;k++){p=p*expectedGoals/k;cumul+=p;}
    let pOver=1-cumul;
    pOver=Math.max(0.20,Math.min(0.80,pOver));
    let over=Math.round((1/pOver)*100)/100;
    let under=Math.round((1/(1-pOver))*100)/100;
    if(over<1.15)over=1.15;
    if(under<1.15)under=1.15;
    if(over>6)over=6;
    if(under>6)under=6;
    return[over,under];
  } else {
    if(state.phase==='first'||state.phase==='break')return'notStarted';
    if(state.phase==='after')return null;
    const g2=state.scenario.goals.filter(g=>g[1]>45&&g[1]<=state.minute).length;
    const min=state.minute;
    if(g2>line)return[1.01,99.00];
    if(g2===line)return[1.01,1.01];
    if(min>=91)return[99.00,1.01];
    const timeLeft=Math.max(1,90-min);
    const needed=Math.floor(line)-g2+1;
    const expectedGoals=timeLeft*(1.25/45);
    let cumul=Math.exp(-expectedGoals),p=cumul;
    for(let k=1;k<needed;k++){p=p*expectedGoals/k;cumul+=p;}
    let pOver=1-cumul;
    pOver=Math.max(0.20,Math.min(0.80,pOver));
    let over=Math.round((1/pOver)*100)/100;
    let under=Math.round((1/(1-pOver))*100)/100;
    if(over<1.15)over=1.15;
    if(under<1.15)under=1.15;
    if(over>6)over=6;
    if(under>6)under=6;
    return[over,under];
  }
}

function getBttsOdds(state){
  const[h,a]=state.score;
  if(h>0&&a>0)return[1.01,25.00];
  const progress=state.minute/90;
  let yes=0.65-progress*0.5;
  if(h>0||a>0)yes+=0.15;
  yes=Math.max(0.05,Math.min(0.9,yes));
  return[Math.round((1/yes)*100)/100,Math.round((1/(1-yes))*100)/100];
}

function getNextGoalOdds(state){
  const[h,a]=state.score;
  const diff=h-a;
  const progress=Math.min(state.minute/90,1);
  let hp=0.45+diff*0.05,ap=0.45-diff*0.05,np=0.10+progress*0.7;
  hp=Math.max(0.05,hp*(1-progress*0.5));
  ap=Math.max(0.05,ap*(1-progress*0.5));
  np=Math.max(0.05,np);
  const s=hp+ap+np;hp/=s;ap/=s;np/=s;
  return[Math.round((1/hp)*100)/100,Math.round((1/np)*100)/100,Math.round((1/ap)*100)/100];
}

function getDoubleChanceOdds(odds){
  const[o1,oX,o2]=odds;
  if(o1===0||oX===0||o2===0)return[0,0,0];
  const p1=1/o1,pX=1/oX,p2=1/o2;
  const s=p1+pX+p2;
  return[Math.round((1/((p1+pX)/s))*100)/100,Math.round((1/((p1+p2)/s))*100)/100,Math.round((1/((pX+p2)/s))*100)/100];
}

function getExactScoreOdds(state){
  const[h,a]=state.score;
  const min=state.minute;
  const tl=Math.max(5,90-min);
  const scores=['0:0','1:0','0:1','1:1','2:0','0:2','2:1','1:2','2:2'];
  const current=h+':'+a;
  return scores.map(s=>{
    let prob;
    const[sh,sa]=s.split(':').map(Number);
    if(s===current)prob=0.5+(1-tl/90)*0.45;
    else if(sh<h||sa<a)prob=0.005;
    else{const gd=(sh-h)+(sa-a);prob=Math.pow(0.35,gd)*(tl/90)*0.25;}
    prob=Math.max(0.005,Math.min(0.99,prob));
    return{score:s,odds:Math.min(99,Math.round((1/prob)*100)/100)};
  });
}

function getMatchStats(match,state){
  const seed=match.id*999+state.cycleIndex*31;
  const r=(o)=>seededRandom(seed+o);
  const progress=Math.min(state.minute/90,1);
  const basePossHome=45+Math.floor(r(1)*15);
  const possHome=Math.min(70,Math.max(30,basePossHome+(state.score[0]-state.score[1])*2));
  const possAway=100-possHome;
  const aH=Math.floor(progress*(50+r(2)*40));
  const aA=Math.floor(progress*(50+r(3)*40));
  const dH=Math.floor(aH*0.4);const dA=Math.floor(aA*0.4);
  const sH=Math.floor(progress*(8+r(4)*8));const sA=Math.floor(progress*(8+r(5)*8));
  const oH=Math.max(state.score[0],Math.floor(sH*0.4));
  const oA=Math.max(state.score[1],Math.floor(sA*0.4));
  const cH=Math.floor(progress*(3+r(6)*5));const cA=Math.floor(progress*(3+r(7)*5));
  const rH=state.minute>=state.scenario.redHome&&state.scenario.redHome>0?1:0;
  const rA=state.minute>=state.scenario.redAway&&state.scenario.redAway>0?1:0;
  const yH=Math.floor(progress*state.scenario.yellowHome);
  const yA=Math.floor(progress*state.scenario.yellowAway);
  return{possHome,possAway,attacksHome:aH,attacksAway:aA,dangerousHome:dH,dangerousAway:dA,shotsHome:sH,shotsAway:sA,onTargetHome:oH,onTargetAway:oA,cornersHome:cH,cornersAway:cA,redHome:rH,redAway:rA,yellowHome:yH,yellowAway:yA};
}

function checkLock(match,state){
  if(state.isFinished)return{locked:true,reason:'⏸ Матч завершён'};
  if(state.isBreak)return{locked:true,reason:'⏸ Перерыв'};
  if(!state.live)return{locked:false,reason:''};
  const rsp=(state.phase==='first'?FIRST_HALF_SEC/45:SECOND_HALF_SEC/45);
  const mToG=3/rsp;
  for(const g of state.scenario.goals){
    const m=g[1]-state.minute;
    if(m>0&&m<=mToG)return{locked:true,reason:'⏸ Приём ставок приостановлен'};
  }
  return{locked:false,reason:''};
}

function formatTimeLeft(sec){const s=Math.max(0,Math.floor(sec));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function getTodayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function getTodayDeposit(){
  if(!currentUser||!DB[currentUser])return 0;
  const today=getTodayKey();
  if(!DB[currentUser].depositDate||DB[currentUser].depositDate!==today){DB[currentUser].depositDate=today;DB[currentUser].depositToday=0;saveDB();}
  return DB[currentUser].depositToday||0;
}

function switchAuth(mode){
  authMode=mode;
  document.getElementById('tabLogin').classList.toggle('active',mode==='login');
  document.getElementById('tabReg').classList.toggle('active',mode==='reg');
  document.getElementById('pass2Input').style.display=mode==='reg'?'block':'none';
  document.getElementById('submitBtn').textContent=mode==='reg'?'Зарегистрироваться':'Войти';
  hideMsg();
}
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg show '+(ok?'ok':'err');}
function hideMsg(){document.getElementById('msg').className='msg';}
function submitAuth(){
  const login=document.getElementById('loginInput').value.trim();
  const pass=document.getElementById('passInput').value;
  if(!login||login.length<3)return showMsg('Логин минимум 3 символа',false);
  if(!pass||pass.length<3)return showMsg('Пароль минимум 3 символа',false);
  if(authMode==='reg'){
    const pass2=document.getElementById('pass2Input').value;
    if(pass!==pass2)return showMsg('Пароли не совпадают',false);
    if(DB[login])return showMsg('Логин занят',false);
    DB[login]={pass,balance:10000,freebet:0,history:[],depositToday:0,depositDate:getTodayKey(),lastSpin:0,createdAt:Date.now()};
    saveDB();
    showMsg('✅ Успешно! Теперь войди',true);
    setTimeout(()=>switchAuth('login'),1200);
    return;
  }
  if(!DB[login])return showMsg('Нет такого аккаунта',false);
  if(DB[login].pass!==pass)return showMsg('Неверный пароль',false);
  currentUser=login;
  balance=DB[login].balance;
  freebet=DB[login].freebet||0;
  betHistory=DB[login].history||[];
  saveCurrent();
  enterApp();
}
function enterApp(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('bottomNav').style.display='flex';
  updateBalanceUI();
  updateFreebetUI();
  renderTabs();
  renderMatches();
  showPage('bets');
  showToast('Привет, '+currentUser+'! 🎉');
}
function logout(){
  if(!confirm('Выйти?'))return;
  DB[currentUser].balance=balance;
  DB[currentUser].freebet=freebet;
  DB[currentUser].history=betHistory;
  saveDB();
  currentUser=null;
  saveCurrent();
  location.reload();
}
function updateBalanceUI(){const el=document.getElementById('balance');if(el)el.textContent='💰 '+balance.toLocaleString('ru-RU')+' ₽';}
function updateFreebetUI(){
  const b=document.getElementById('freebetBadge'),a=document.getElementById('freebetAmount');
  if(freebet>0){b.classList.add('show');a.textContent=freebet.toLocaleString('ru-RU')+' ₽';}
  else b.classList.remove('show');
  const btn=document.getElementById('useFreebetBtn');
  if(btn)btn.classList.toggle('show',freebet>0&&bets.length>0);
}
function showDeposit(){
  const today=getTodayDeposit();
  const left=DAILY_LIMIT-today;
  if(left<=0)return showToast('❌ Лимит исчерпан',false);
  const amount=prompt('Сумма пополнения\n\nСегодня: '+today.toLocaleString('ru-RU')+' ₽\nОсталось: '+left.toLocaleString('ru-RU')+' ₽',String(Math.min(1000,left)));
  if(!amount)return;
  const num=Number(amount);
  if(isNaN(num)||num<=0)return showToast('Неверная сумма',false);
  if(num>left)return showToast('❌ Максимум: '+left.toLocaleString('ru-RU')+' ₽',false);
  balance+=num;
  DB[currentUser].balance=balance;
  DB[currentUser].depositToday=today+num;
  DB[currentUser].depositDate=getTodayKey();
  saveDB();
  updateBalanceUI();
  showToast('✅ +'+num.toLocaleString('ru-RU')+' ₽');
}

  document.getElementById('pageRoulette').style.display=page==='roulette'?'block':'none';

  document.getElementById('pName').textContent=currentUser;
  document.getElementById('pBalance').textContent=balance.toLocaleString('ru-RU')+' ₽';
  document.getElementById('pFreebet').textContent=freebet.toLocaleString('ru-RU')+' ₽';
  document.getElementById('pBets').textContent=betHistory.length;
  document.getElementById('pWins').textContent=betHistory.filter(b=>b.status==='win').length;
  const inPlay=betHistory.filter(b=>b.status==='pending').reduce((a,b)=>a+b.stake,0);
  document.getElementById('pInPlay').textContent=inPlay.toLocaleString('ru-RU')+' ₽';
  const left=DAILY_LIMIT-getTodayDeposit();
  const le=document.getElementById('pLimit');
  le.textContent=left.toLocaleString('ru-RU')+' ₽';
  le.style.color=left<=0?'var(--red)':(left<500000?'var(--accent)':'var(--green)');
  const hist=document.getElementById('history');
  if(!betHistory.length){hist.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:13px">Ставок пока нет</div>';return;}
  hist.innerHTML=betHistory.slice().reverse().map(b=>{
    const st=b.status==='pending'?'⏳ В игре':b.status==='win'?'✅ Выигрыш':b.status==='return'?'🔄 Возврат':b.status==='cashout'?'💸 Кэшаут':'❌ Проигрыш';
    let cashoutBtn='';
    if(b.status==='pending'){
      const co=calculateCashout(b);
      if(co>0)cashoutBtn='<button class="cashout-btn" onclick="cashoutBet('+b.id+')">💸 Забрать '+co+' ₽</button>';
    }

    if(b.status==='cashout')cashoutInfo=' (выплачено '+b.cashoutAmount+' ₽)';
    return '<div class="history-item"><div>'+b.items.map(i=>(i.market||'Исход')+': '+i.home+'—'+i.away).join(', ')+'</div><div style="color:var(--text-dim);font-size:11px;margin-top:4px">Ставка: '+b.stake+' ₽ × '+b.totalOdds.toFixed(2)+'<span class="status '+b.status+'">'+st+'</span>'+cashoutInfo+'</div>'+cashoutBtn+'</div>';
  }).join('');
}
function calculateCashout(bet){
  if(bet.status!=='pending')return 0;
  let totalProb=1;
  for(const item of bet.items){
    const m=findMatchById(item.matchId);
    if(!m)return 0;
    const state=getMatchState(m);
    if(state.isFinished)return 0;
    const odds=getMatchOdds(m,state);
    let pCurrent=1/item.odds;
    const mk=item.marketKey||'';
    if(mk.startsWith('main_'))pCurrent=1/odds[item.outcome];
    totalProb*=pCurrent;
  }
  let initialProb=1/bet.totalOdds;
  let cashout=bet.stake*(totalProb/initialProb)*0.9;
  if(cashout>bet.potentialWin)cashout=bet.potentialWin*0.95;
  if(cashout<bet.stake*0.05)cashout=bet.stake*0.05;
  return Math.round(cashout);
}
function cashoutBet(betId){
  const bet=betHistory.find(b=>b.id===betId);
  if(!bet||bet.status!=='pending')return;
  const amount=calculateCashout(bet);
  if(amount<=0)return showToast('Кэшаут недоступен',false);
  if(!confirm('Забрать '+amount+' ₽ вместо '+bet.potentialWin.toFixed(0)+' ₽?'))return;
  bet.status='cashout';
  bet.cashoutAmount=amount;
  balance+=amount;
  DB[currentUser].balance=balance;
  DB[currentUser].history=betHistory;
  saveDB();
  updateBalanceUI();
  showToast('💸 Кэшаут: +'+amount+' ₽',true);
  renderProfile();
}
function renderRoulette(){
  const lastSpin=DB[currentUser].lastSpin||0;
  const nextSpin=lastSpin+WEEK_MS;
  const now=Date.now();
  const btn=document.getElementById('spinBtn');
  const cd=document.getElementById('cooldown');
  if(now>=nextSpin){btn.disabled=false;btn.textContent='КРУТИТЬ 🎰';cd.textContent='Доступно!';cd.style.color='var(--green)';}
  else{
    btn.disabled=true;btn.textContent='⏳ Недоступно';
    const left=nextSpin-now;
    const d=Math.floor(left/(24*60*60*1000));
    const h=Math.floor((left%(24*60*60*1000))/(60*60*1000));
    const m=Math.floor((left%(60*60*1000))/(60*1000));
    cd.textContent='Через '+d+'д '+h+'ч '+m+'м';
    cd.style.color='var(--text-dim)';
  }
}
function spinWheel(){
  const lastSpin=DB[currentUser].lastSpin||0;
  if(Date.now()<lastSpin+WEEK_MS)return showToast('⏳ Ещё рано!',false);
  const btn=document.getElementById('spinBtn');
  btn.disabled=true;btn.textContent='Крутится...';
  const idx=Math.floor(Math.random()*PRIZES.length);
  const prize=PRIZES[idx];
  const angle=360*5+(360-idx*60-30);
  document.getElementById('wheel').style.transform='rotate('+angle+'deg)';
  setTimeout(()=>{
    freebet+=prize;
    DB[currentUser].freebet=freebet;
    DB[currentUser].lastSpin=Date.now();
    saveDB();
    updateFreebetUI();
    document.getElementById('resultAmount').textContent='+'+prize.toLocaleString('ru-RU')+' ₽';
    if(prize===15000){document.getElementById('resultEmoji').textContent='👑';document.getElementById('resultTitle').textContent='ДЖЕКПОТ!';}
    else if(prize>=5000){document.getElementById('resultEmoji').textContent='🔥';document.getElementById('resultTitle').textContent='Крупный приз!';}
    else{document.getElementById('resultEmoji').textContent='🎉';document.getElementById('resultTitle').textContent='Поздравляем!';}
    document.getElementById('resultText').textContent='Фрибет зачислен';
    document.getElementById('resultModal').style.display='flex';
    renderRoulette();
  },5200);
}

}

function renderMatches(){
  refreshMatches();
  const list=MATCHES_CACHE||[];
  document.getElementById('matches').innerHTML=list.map(m=>{
    const state=getMatchState(m);
    const odds=getMatchOdds(m,state);
    const lock=checkLock(m,state);
    const labels=['1','X','2'];
    let timeDisplay='';
    if(state.live)timeDisplay='<span class="live-dot"></span>'+state.timeStr;
    else if(state.isBreak)timeDisplay='⏸ Перерыв '+formatTimeLeft(state.breakLeft);
    else if(state.isFinished)timeDisplay='⏱ Новый через '+formatTimeLeft(state.afterLeft);
    let banner='';
    if(state.isFinished)banner='<div class="lock-banner restart">✅ Матч завершён. Новый через '+formatTimeLeft(state.afterLeft)+'</div>';
    else if(state.isBreak)banner='<div class="lock-banner break">⏸ Перерыв — 2-й тайм через '+formatTimeLeft(state.breakLeft)+'</div>';
    else if(lock.locked)banner='<div class="lock-banner">'+lock.reason+'</div>';
    const showScore=state.live||state.isFinished||state.isBreak;
    const myBetClass=myBetMatchIds[m.id]?' mybet':'';
    return '<div class="match'+myBetClass+'" id="match-'+m.id+'" onclick="openSpread('+m.id+')">'+
      '<div class="match-header"><span class="league">'+m.league+'</span><span class="time">'+timeDisplay+'</span></div>'+
      '<div class="teams">'+m.home+' — '+m.away+(showScore?'<span class="score">'+state.score[0]+':'+state.score[1]+'</span>':'')+'</div>'+
      banner+
      '<div class="odds-row">'+
        odds.map((o,i)=>'<div class="odd '+(isSelected(m.id,null,i)?'selected ':'')+(lock.locked?'locked':'')+'" '+(lock.locked?'':'onclick="event.stopPropagation();addBet('+m.id+',null,'+i+','+o+')"')+'><div class="odd-label">'+labels[i]+'</div><div class="odd-value">'+o.toFixed(2)+'</div></div>').join('')+
      '</div>'+
      '<div class="match-hint">👆 Тапни — открыть все рынки</div>'+
    '</div>';
  }).join('');
}
function isSelected(matchId,marketKey,outcome){
  if(marketKey)return bets.some(b=>b.matchId===matchId&&b.marketKey===marketKey&&b.outcome===outcome);
  return bets.some(b=>b.matchId===matchId&&!b.marketKey&&b.outcome===outcome);
}
function addBet(matchId,market,outcome,odds,label,marketKey){
  const m=findMatchById(matchId);
  if(!m)return;
  const state=getMatchState(m);
  const lock=checkLock(m,state);
  if(lock.locked){showToast('⏸ '+lock.reason,false);return;}
  const key=marketKey||null;
  const finalLabel=label||['1','X','2'][outcome]||'';
  const idx=bets.findIndex(b=>b.matchId===matchId&&b.marketKey===key&&b.outcome===outcome);
  if(idx!==-1)bets.splice(idx,1);
  else bets.push({matchId,outcome,odds,label:finalLabel,home:m.home,away:m.away,market:market||'Исход',marketKey:key});
  renderMatches();
  renderSlip();
  if(currentSpreadMatch===matchId)renderSpreadBody();
}
function removeBet(i){bets.splice(i,1);renderMatches();renderSlip();if(currentSpreadMatch)renderSpreadBody();}
function cleanLockedBets(){
  if(!bets.length)return;
  let changed=false;
  for(let i=bets.length-1;i>=0;i--){
    const b=bets[i];
    const m=findMatchById(b.matchId);
    if(!m)continue;
    const state=getMatchState(m);
    const lock=checkLock(m,state);
    if(lock.locked){bets.splice(i,1);changed=true;}
  }
  if(changed){renderMatches();renderSlip();}
}
function renderSlip(){
  const badge=document.getElementById('badge');
  document.getElementById('badgeCount').textContent=bets.length;
  badge.classList.toggle('show',bets.length>0);
  document.getElementById('slipItems').innerHTML=bets.length
    ?bets.map((b,i)=>'<div class="slip-item"><button class="remove" onclick="removeBet('+i+')">✕</button><div>'+b.home+' — '+b.away+'</div><div class="m">'+(b.market||'Исход')+': '+b.label+' <span class="o">@ '+b.odds.toFixed(2)+'</span></div></div>').join('')
    :'<div style="color:var(--text-dim);text-align:center;padding:20px">Купон пуст</div>';
  if(bets.length>1)document.getElementById('slipExpress').innerHTML='<div class="slip-express">🔥 Экспресс: '+bets.length+' событий</div>';
  else document.getElementById('slipExpress').innerHTML='';
  updateFreebetUI();
  updatePayout();
}
function toggleFreebet(){
  if(freebet<=0)return showToast('Нет фрибетов',false);
  useFreebet=!useFreebet;
  const btn=document.getElementById('useFreebetBtn');
  if(useFreebet){btn.textContent='✅ Фрибет применяется';btn.style.background='var(--green)';btn.style.color='#fff';}
  else{btn.textContent='🎁 Использовать фрибет ('+freebet.toLocaleString('ru-RU')+' ₽)';btn.style.background='var(--accent)';btn.style.color='#000';}
  updatePayout();
}
function updatePayout(){
  const stake=Number(document.getElementById('stakeInput').value)||0;
  const totalOdds=bets.reduce((a,b)=>a*b.odds,1);
  const win=stake*(bets.length?totalOdds:0);
  let text=win.toFixed(0)+' ₽';
  if(useFreebet&&freebet>0)text+=' ('+Math.min(stake,freebet)+'₽ фрибет)';
  document.getElementById('payout').textContent=text;
}
document.getElementById('stakeInput').addEventListener('input',updatePayout);
function setStake(v){document.getElementById('stakeInput').value=v;updatePayout();}
function toggleSlip(){document.getElementById('slip').classList.toggle('open');}
function placeBet(){
  if(!bets.length)return showToast('Купон пуст',false);
  const stake=Number(document.getElementById('stakeInput').value)||0;
  if(stake<10)return showToast('Мин. ставка 10 ₽',false);
  let rms=stake,fbu=0;
  if(useFreebet&&freebet>0){fbu=Math.min(stake,freebet);rms=stake-fbu;}
  if(rms>balance)return showToast('Недостаточно средств',false);
  const totalOdds=bets.reduce((a,b)=>a*b.odds,1);
  const pw=stake*totalOdds;
  balance-=rms;
  freebet-=fbu;
  const items=bets.map(b=>{
    const m=findMatchById(b.matchId);
    const state=getMatchState(m);
    return{...b,cycleIndex:state.cycleIndex};
  });
  const record={id:Date.now(),items,stake,freebetUsed:fbu,totalOdds,potentialWin:pw,status:'pending',createdAt:Date.now()};
  betHistory.push(record);
  items.forEach(it=>{myBetMatchIds[it.matchId]=true;});
  DB[currentUser].balance=balance;
  DB[currentUser].freebet=freebet;
  DB[currentUser].history=betHistory;
  saveDB();
  updateBalanceUI();
  updateFreebetUI();
  useFreebet=false;
  const fb=document.getElementById('useFreebetBtn');
  fb.textContent='🎁 Использовать фрибет';
  fb.style.background='var(--accent)';
  fb.style.color='#000';
  let msg='✅ Ставка '+stake+' ₽';
  if(fbu>0)msg+=' (фрибет '+fbu+' ₽)';
  showToast(msg+' | Потенциал: '+pw.toFixed(0)+' ₽');
  bets=[];
  renderMatches();
  renderSlip();
  toggleSlip();
}

  if(!m)return;
  currentSpreadMatch=matchId;
  currentSpreadTab='match';
  currentSpreadStat=false;
  half1TotalLine=0.5;
  half2TotalLine=0.5;
  document.getElementById('spreadModal').classList.add('show');
  renderSpreadHead();
  renderSpreadTabs();
  renderSpreadBody();
}
function closeSpread(){document.getElementById('spreadModal').classList.remove('show');currentSpreadMatch=null;}
function toggleStats(){currentSpreadStat=!currentSpreadStat;document.getElementById('statsBtn').classList.toggle('active',currentSpreadStat);renderSpreadBody();}
function renderSpreadHead(){
  const m=findMatchById(currentSpreadMatch);
  if(!m)return;
  const state=getMatchState(m);
  const showScore=state.live||state.isFinished||state.isBreak;
  const ts=state.live?'🔴 '+state.timeStr:(state.isBreak?'⏸ Перерыв':(state.isFinished?'Завершён':'Скоро'));

    '<div class="spread-league">'+m.league+'</div>'+
    '<div class="spread-teams-line"><span>'+m.home+' — '+m.away+'</span>'+
    (showScore?'<span class="sc">'+state.score[0]+':'+state.score[1]+'</span>':'')+'</div>'+

function renderSpreadTabs(){
  const tabs=[{id:'match',label:'Матч'},{id:'half1',label:'1-й тайм'},{id:'half2',label:'2-й тайм'}];
  document.getElementById('spreadTabs').innerHTML=tabs.map(t=>'<button class="spread-tab '+(currentSpreadTab===t.id?'active':'')+'" onclick="setSpreadTab(\''+t.id+'\')">'+t.label+'</button>').join('');
}
function setSpreadTab(id){currentSpreadTab=id;renderSpreadTabs();renderSpreadBody();}
function marketBtn(label,value,opts){
  const selected=isSelected(opts.matchId,opts.marketKey,opts.outcome);
  const m=findMatchById(opts.matchId);
  const state=getMatchState(m);
  const lock=checkLock(m,state);
  const locked=lock.locked;
  return '<div class="market-btn '+(selected?'selected ':'')+(locked?'locked':'')+'" '+
    (locked?'':'onclick="event.stopPropagation();marketClick('+opts.matchId+',\''+(opts.market||'')+'\','+opts.outcome+','+value+',\''+(opts.label||'')+'\',\''+(opts.marketKey||'')+'\')"')+'>'+
    '<span class="mbl">'+label+'</span><span class="mbv">'+(value>0?value.toFixed(2):'—')+'</span></div>';
}
function marketClick(matchId,market,outcome,odds,label,marketKey){addBet(matchId,market,outcome,odds,label,marketKey);}
function renderSpreadBody(){
  const body=document.getElementById('spreadBody');
  if(currentSpreadStat){renderStats(body);return;}
  const m=findMatchById(currentSpreadMatch);
  if(!m){body.innerHTML='<div class="no-data">Матч не найден</div>';return;}
  const state=getMatchState(m);
  const mainOdds=getMatchOdds(m,state);
  const dcOdds=getDoubleChanceOdds(mainOdds);
  const nextGoal=getNextGoalOdds(state);
  const btts=getBttsOdds(state);
  const exact=getExactScoreOdds(state);
  const[h,a]=state.score;
  const totalGoals=h+a;
  let html='';
  if(currentSpreadTab==='match'){
    html+='<div class="market-section"><div class="market-title">Исход матча</div>'+
      '<div class="market-row">'+
        marketBtn('1',mainOdds[0],{matchId:m.id,market:'Исход',outcome:0,label:'1',marketKey:'main_1'})+
        marketBtn('X',mainOdds[1],{matchId:m.id,market:'Исход',outcome:1,label:'X',marketKey:'main_X'})+
        marketBtn('2',mainOdds[2],{matchId:m.id,market:'Исход',outcome:2,label:'2',marketKey:'main_2'})+
      '</div>'+
      '<div class="market-row">'+
        marketBtn('1X',dcOdds[0],{matchId:m.id,market:'Двойной шанс',outcome:0,label:'1X',marketKey:'dc_1X'})+
        marketBtn('12',dcOdds[1],{matchId:m.id,market:'Двойной шанс',outcome:1,label:'12',marketKey:'dc_12'})+
        marketBtn('X2',dcOdds[2],{matchId:m.id,market:'Двойной шанс',outcome:2,label:'X2',marketKey:'dc_X2'})+
      '</div>'+
    '</div>';
    const totalLines=[0.5,1.5,2,2.5,3,3.5,4.5,5.5];
    const available=totalLines.filter(line=>{
      if(totalGoals>line)return false;
      if(state.minute>=90&&totalGoals<line)return false;
      return true;
    });
    html+='<div class="market-section"><div class="market-title">Тотал голов</div>';
    if(available.length>0){
      if(!available.includes(totalLine))totalLine=available[Math.floor(available.length/2)];
      html+='<div class="total-selector">';
      available.forEach(n=>{html+='<button class="total-num '+(totalLine===n?'active':'')+'" onclick="setTotal('+n+')">'+n+'</button>';});
      html+='</div>';
      const tOdds=getTotalOdds(state,totalLine);
      if(totalGoals===totalLine){
        html+='<div style="color:var(--text-dim);text-align:center;padding:10px;font-size:12px">Тотал ровно '+totalLine+' — возврат</div>';
      } else {
        html+='<div class="market-row">'+
          marketBtn('Больше '+totalLine,tOdds[0],{matchId:m.id,market:'Тотал '+totalLine,outcome:0,label:'ТБ '+totalLine,marketKey:'total_over_'+totalLine})+
          marketBtn('Меньше '+totalLine,tOdds[1],{matchId:m.id,market:'Тотал '+totalLine,outcome:1,label:'ТМ '+totalLine,marketKey:'total_under_'+totalLine})+
        '</div>';
      }
    } else {
      html+='<div style="color:var(--text-dim);text-align:center;padding:14px;font-size:13px">Нет доступных линий</div>';
    }
    html+='</div>';
    html+='<div class="market-section"><div class="market-title">Обе команды забьют</div><div class="market-row">'+
      marketBtn('Да',btts[0],{matchId:m.id,market:'Обе забьют',outcome:0,label:'Да',marketKey:'btts_yes'})+
      marketBtn('Нет',btts[1],{matchId:m.id,market:'Обе забьют',outcome:1,label:'Нет',marketKey:'btts_no'})+
    '</div></div>';
    html+='<div class="market-section"><div class="market-title">Следующий гол</div><div class="market-row">'+
      marketBtn(m.home,nextGoal[0],{matchId:m.id,market:'Следующий гол',outcome:0,label:m.home,marketKey:'next_1'})+
      marketBtn('Никто',nextGoal[1],{matchId:m.id,market:'Следующий гол',outcome:1,label:'Никто',marketKey:'next_none'})+
      marketBtn(m.away,nextGoal[2],{matchId:m.id,market:'Следующий гол',outcome:2,label:m.away,marketKey:'next_2'})+
    '</div></div>';
    html+='<div class="market-section"><div class="market-title">Точный счёт</div><div class="score-grid">';
    exact.forEach(e=>{
      html+='<div class="score-cell '+(isSelected(m.id,'exact_'+e.score,e.score)?'selected':'')+'" onclick="event.stopPropagation();marketClick('+m.id+',\'Точный счёт\',\''+e.score+'\','+e.odds+',\''+e.score+'\',\'exact_'+e.score+'\')"><div class="scl">'+e.score+'</div><div class="scv">'+e.odds.toFixed(2)+'</div></div>';
    });
    html+='</div></div>';
  }
  if(currentSpreadTab==='half1'){
    if(state.phase!=='first'){
      html+='<div class="no-data">⏸ 1-й тайм завершён<br><br>Ставки откроются в следующем матче</div>';
    } else {
      const g1=h+a;
      const h1L=[0.5,1.5,2.5,3.5];
      const available=h1L.filter(line=>{
        if(g1>line)return false;
        if(state.minute>=45&&g1<line)return false;
        return true;
      });
      html+='<div class="market-section"><div class="market-title">Тотал голов в 1-м тайме</div>';
      if(available.length>0){
        if(!available.includes(half1TotalLine))half1TotalLine=available[0];
        html+='<div class="total-selector">';
        available.forEach(n=>{html+='<button class="total-num '+(half1TotalLine===n?'active':'')+'" onclick="setHalf1Total('+n+')">'+n+'</button>';});
        html+='</div>';
        const h1=getHalfTotalOdds(state,1,half1TotalLine);
        if(h1&&Array.isArray(h1)){
          if(g1===half1TotalLine){
            html+='<div style="color:var(--text-dim);text-align:center;padding:10px;font-size:12px">Тотал ровно '+half1TotalLine+' — возврат</div>';
          } else {
            html+='<div class="market-row">'+
              marketBtn('Больше '+half1TotalLine,h1[0],{matchId:m.id,market:'Тотал 1Т '+half1TotalLine,outcome:0,label:'ТБ '+half1TotalLine+' 1Т',marketKey:'h1_over_'+half1TotalLine})+
              marketBtn('Меньше '+half1TotalLine,h1[1],{matchId:m.id,market:'Тотал 1Т '+half1TotalLine,outcome:1,label:'ТМ '+half1TotalLine+' 1Т',marketKey:'h1_under_'+half1TotalLine})+
            '</div>';
          }
        }
      } else {
        html+='<div style="color:var(--text-dim);text-align:center;padding:14px;font-size:13px">Нет доступных линий</div>';
      }
      html+='</div>';
    }
  }
  if(currentSpreadTab==='half2'){
    if(state.phase==='first'||state.phase==='break'){
      html+='<div class="no-data">⏸ 2-й тайм ещё не начался<br><br>Ставки откроются после перерыва</div>';
    } else if(state.phase==='after'){
      html+='<div class="no-data">⏸ Матч завершён<br><br>Ставки откроются в следующем матче</div>';
    } else {
      const g2=state.scenario.goals.filter(g=>g[1]>45&&g[1]<=state.minute).length;
      const h2L=[0.5,1.5,2.5,3.5];
      const available=h2L.filter(line=>{
        if(g2>line)return false;
        if(state.minute>=90&&g2<line)return false;
        return true;
      });
      html+='<div class="market-section"><div class="market-title">Тотал голов во 2-м тайме</div>';
      if(available.length>0){
        if(!available.includes(half2TotalLine))half2TotalLine=available[0];
        html+='<div class="total-selector">';
        available.forEach(n=>{html+='<button class="total-num '+(half2TotalLine===n?'active':'')+'" onclick="setHalf2Total('+n+')">'+n+'</button>';});
        html+='</div>';
        const h2=getHalfTotalOdds(state,2,half2TotalLine);
        if(h2&&Array.isArray(h2)){
          if(g2===half2TotalLine){
            html+='<div style="color:var(--text-dim);text-align:center;padding:10px;font-size:12px">Тотал ровно '+half2TotalLine+' — возврат</div>';
          } else {
            html+='<div class="market-row">'+
              marketBtn('Больше '+half2TotalLine,h2[0],{matchId:m.id,market:'Тотал 2Т '+half2TotalLine,outcome:0,label:'ТБ '+half2TotalLine+' 2Т',marketKey:'h2_over_'+half2TotalLine})+
              marketBtn('Меньше '+half2TotalLine,h2[1],{matchId:m.id,market:'Тотал 2Т '+half2TotalLine,outcome:1,label:'ТМ '+half2TotalLine+' 2Т',marketKey:'h2_under_'+half2TotalLine})+
            '</div>';
          }
        }
      } else {
        html+='<div style="color:var(--text-dim);text-align:center;padding:14px;font-size:13px">Нет доступных линий</div>';
      }
      html+='</div>';
    }
  }
  body.innerHTML=html;
}
function setTotal(n){totalLine=n;renderSpreadBody();}
function setHalf1Total(n){half1TotalLine=n;renderSpreadBody();}
function setHalf2Total(n){half2TotalLine=n;renderSpreadBody();}
function renderStats(container){
  const m=findMatchById(currentSpreadMatch);
  if(!m){container.innerHTML='<div class="no-data">Матч не найден</div>';return;}
  const state=getMatchState(m);
  if(!state.live&&!state.isBreak&&!state.isFinished){
    container.innerHTML='<div class="no-data">📊 Статистика появится с началом матча</div>';return;
  }
  const s=getMatchStats(m,state);
  container.innerHTML='<div class="stats-body">'+
    '<div class="stat-item"><div class="stat-row"><span>'+m.home+'</span><span>'+m.away+'</span></div>'+
      '<div class="stat-row"><span class="stat-val-home">'+s.possHome+'%</span><span>Владение</span><span class="stat-val-away">'+s.possAway+'%</span></div>'+
      '<div class="stat-bar"><div class="stat-bar-home" style="width:'+s.possHome+'%"></div><div class="stat-bar-away" style="width:'+s.possAway+'%"></div></div>'+
    '</div>'+
    '<div class="stat-item"><div class="stat-row"><span class="stat-val-home">'+s.shotsHome+'</span><span>Удары</span><span class="stat-val-away">'+s.shotsAway+'</span></div></div>'+
    '<div class="stat-item"><div class="stat-row"><span class="stat-val-home">'+s.onTargetHome+'</span><span>Удары в створ</span><span class="stat-val-away">'+s.onTargetAway+'</span></div></div>'+
    '<div class="stat-item"><div class="stat-row"><span class="stat-val-home">'+s.attacksHome+'</span><span>Атаки</span><span class="stat-val-away">'+s.attacksAway+'</span></div></div>'+
    '<div class="stat-item"><div class="stat-row"><span class="stat-val-home">'+s.dangerousHome+'</span><span>Опасные атаки</span><span class="stat-val-away">'+s.dangerousAway+'</span></div></div>'+
    '<div class="stat-item"><div class="stat-row"><span class="stat-val-home">'+s.cornersHome+'</span><span>Угловые</span><span class="stat-val-away">'+s.cornersAway+'</span></div></div>'+
    '<div class="stat-item"><div class="stat-row"><span class="stat-val-home">🟨 '+s.yellowHome+' '+(s.redHome?'🟥 '+s.redHome:'')+'</span><span>Карточки</span><span class="stat-val-away">'+(s.redAway?'🟥 '+s.redAway+' ':'')+'🟨 '+s.yellowAway+'</span></div></div>'+
  '</div>';
}
function checkBetResults(){
  if(!currentUser)return;
  let changed=false;
  betHistory.forEach(bet=>{
    if(bet.status!=='pending')return;
    let allFinished=true,allWon=true,anyReturn=false;
    for(const item of bet.items){
      const m=findMatchById(item.matchId);
      if(!m){allFinished=false;break;}
      const state=getMatchState(m);
      let finalScore=null;
      if(state.isFinished&&state.cycleIndex===item.cycleIndex)finalScore=state.score;
      else if(state.cycleIndex>item.cycleIndex){
        const sc=generateScenario(m,item.cycleIndex);
        let h=0,a=0;
        sc.goals.forEach(g=>{if(g[0]===0)h++;else a++;});
        finalScore=[h,a];
      } else {allFinished=false;break;}
      const[h,a]=finalScore;
      const total=h+a;
      let won=false,isReturn=false;
      const mk=item.marketKey||'';
      if(mk.startsWith('main_')){
        let outcome;if(h>a)outcome=0;else if(h===a)outcome=1;else outcome=2;
        won=(outcome===item.outcome);
      } else if(mk==='dc_1X')won=(h>=a);
      else if(mk==='dc_12')won=(h!==a);
      else if(mk==='dc_X2')won=(h<=a);
      else if(mk.startsWith('total_over_')){
        const line=parseFloat(mk.replace('total_over_',''));
        if(total>line)won=true;else if(total===line)isReturn=true;
      } else if(mk.startsWith('total_under_')){
        const line=parseFloat(mk.replace('total_under_',''));
        if(total<line)won=true;else if(total===line)isReturn=true;
      } else if(mk==='btts_yes')won=(h>0&&a>0);
      else if(mk==='btts_no')won=!(h>0&&a>0);
      else if(mk.startsWith('next_'))won=true;
      else if(mk.startsWith('exact_')){
        const sc=mk.replace('exact_','');
        won=(sc===h+':'+a);
      } else if(mk.startsWith('h1_over_')){
        const line=parseFloat(mk.replace('h1_over_',''));
        const sc=generateScenario(m,item.cycleIndex);
        const endH1=45+sc.injury1;
        const g1=sc.goals.filter(g=>g[1]<=endH1).length;
        if(g1>line)won=true;else if(g1===line)isReturn=true;
      } else if(mk.startsWith('h1_under_')){
        const line=parseFloat(mk.replace('h1_under_',''));
        const sc=generateScenario(m,item.cycleIndex);
        const endH1=45+sc.injury1;
        const g1=sc.goals.filter(g=>g[1]<=endH1).length;
        if(g1<line)won=true;else if(g1===line)isReturn=true;
      } else if(mk.startsWith('h2_over_')){
        const line=parseFloat(mk.replace('h2_over_',''));
        const sc=generateScenario(m,item.cycleIndex);
        const g2=sc.goals.filter(g=>g[1]>45).length;
        if(g2>line)won=true;else if(g2===line)isReturn=true;
      } else if(mk.startsWith('h2_under_')){
        const line=parseFloat(mk.replace('h2_under_',''));
        const sc=generateScenario(m,item.cycleIndex);
        const g2=sc.goals.filter(g=>g[1]>45).length;
        if(g2<line)won=true;else if(g2===line)isReturn=true;
      } else {
        let outcome;if(h>a)outcome=0;else if(h===a)outcome=1;else outcome=2;
        won=(outcome===item.outcome);
      }
      if(isReturn)anyReturn=true;
      if(!won&&!isReturn)allWon=false;
    }
    if(allFinished){
      if(anyReturn&&!allWon){bet.status='lose';showToast('😔 Ставка не сыграла',false);}
      else if(anyReturn&&allWon){bet.status='win';balance+=bet.stake;DB[currentUser].balance=balance;updateBalanceUI();showToast('🔄 ЧАСТИЧНЫЙ ВОЗВРАТ! +'+bet.stake+' ₽',true);}
      else if(anyReturn){balance+=bet.stake;DB[currentUser].balance=balance;updateBalanceUI();showToast('🔄 ВОЗВРАТ: +'+bet.stake+' ₽',true);bet.status='return';}
      else if(allWon){bet.status='win';balance+=bet.potentialWin;DB[currentUser].balance=balance;updateBalanceUI();showToast('🎉 ВЫИГРЫШ! +'+bet.potentialWin.toFixed(0)+' ₽',true);}
      else{bet.status='lose';showToast('😔 Ставка не сыграла',false);}
      changed=true;
    }
  });
  if(changed){
    DB[currentUser].balance=balance;
    DB[currentUser].history=betHistory;
    saveDB();
    if(document.getElementById('pageProfile').style.display!=='none')renderProfile();
  }
}
function checkGoals(){
  if(!currentUser)return;
  (MATCHES_CACHE||[]).forEach(m=>{
    const state=getMatchState(m);
    if(!state.live)return;
    const key='goal_'+m.id+'_'+state.cycleIndex;
    const cur=state.score.join(':');
    if(shownGoalKeys[key]&&shownGoalKeys[key]!==cur){
      const myBet=betHistory.some(b=>b.status==='pending'&&b.items.some(it=>it.matchId===m.id));
      if(myBet){
        showToast('⚽⚽⚽ ГОЛ! '+m.home+' '+cur+' '+m.away+' — ТВОЯ СТАВКА!',true);
        const el=document.getElementById('match-'+m.id);
        if(el){el.classList.add('goal-flash');setTimeout(()=>el.classList.remove('goal-flash'),2000);}
        if(navigator.vibrate)navigator.vibrate([200,100,200]);
      } else {
        showToast('⚽ ГОЛ! '+m.home+' '+cur+' '+m.away,true);
      }
    }
    shownGoalKeys[key]=cur;
  });
}
setInterval(()=>{
  if(!currentUser)return;
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  const ss=String(now.getSeconds()).padStart(2,'0');
  const syncEl=document.getElementById('syncInfo');
  if(syncEl)syncEl.textContent='🕒 '+hh+':'+mm+':'+ss+' • Синхр. у всех';
  if(!currentSpreadMatch)renderMatches();
  checkGoals();
  checkBetResults();
  cleanLockedBets();
  if(currentSpreadMatch){renderSpreadHead();renderSpreadBody();}
  if(document.getElementById('pageProfile').style.display!=='none')renderProfile();
},1000);
setInterval(()=>{
  if(currentUser&&document.getElementById('pageRoulette').style.display!=='none')renderRoulette();
},60000);
let toastTimer;
function showToast(text,ok=true){
  const t=document.getElementById('toast');
  t.textContent=text;
  t.style.background=ok?'var(--green)':'var(--red)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
if(currentUser&&DB[currentUser]){
  balance=DB[currentUser].balance;
  freebet=DB[currentUser].freebet||0;
  betHistory=DB[currentUser].history||[];
  enterApp();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('authScreen').style.display!=='none')submitAuth();
});
